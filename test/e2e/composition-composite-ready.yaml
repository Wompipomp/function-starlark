# Composition for composite-readiness gating tests. Five modes driven by
# spec.mode on the XR:
#   "gate"        -- When(condition=False) without optional. The skipped
#                     resource gates the XR to Ready=False and an informational
#                     ComposedResourcesReady=False condition is emitted.
#   "optional"    -- When(condition=False, optional=True). The skipped resource
#                     does NOT gate the XR; it still reaches Ready=True.
#   "explicit"    -- set_composite_ready(False, reason=..., message=...). The
#                     XR stays Ready=False with the user-supplied reason, even
#                     though no resources were skipped.
#   "ready-false" -- Resource(ready=False). The composed resource IS created
#                     and its MR reaches Ready=True, but the explicit readiness
#                     override keeps the XR from becoming Ready (and
#                     function-auto-ready must not overrule it).
#   "ready-true"  -- Resource(ready=True). The composed MR never reports
#                     Ready=True itself (conditionAfter sets Ready=False), but
#                     the explicit override marks it ready so the XR reaches
#                     Ready=True anyway.
#
# Every mode also emits a dummy NopResource that reaches Ready=True so the
# "optional" case can actually reach the Ready condition.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: composite-ready-test
  labels:
    e2e-test: composite-ready
spec:
  compositeTypeRef:
    apiVersion: e2e.fn-starlark.io/v1
    kind: XTest
  mode: Pipeline
  pipeline:
    - step: composite-ready-scenarios
      functionRef:
        name: function-starlark
      input:
        apiVersion: starlark.fn.crossplane.io/v1alpha1
        kind: StarlarkInput
        spec:
          source: |
            mode = get(oxr, "spec.mode", "gate")
            set_xr_status("test.mode", mode)

            # Always emit one dummy NopResource so the "optional" case has
            # something to become Ready on.
            Resource("dummy", {
                "apiVersion": "nop.crossplane.io/v1alpha1",
                "kind": "NopResource",
                "spec": {"forProvider": {"conditionAfter": [
                    {"conditionType": "Ready", "conditionStatus": "True", "time": "0s"},
                    {"conditionType": "Synced", "conditionStatus": "True", "time": "0s"},
                ]}},
            })

            if mode == "gate":
                # Auto-gate: skip without When(optional=True) → XR Ready=False + condition.
                Resource("pending-dep", None,
                    when=When(False, "E2E: auto-gating test, dependency not yet provisioned", keep_if_exists=False))
                set_xr_status("test.scenario", "auto-gate")

            elif mode == "optional":
                # Opt-out: skip with When(optional=True) → XR still reaches Ready.
                Resource("optional-feature", None,
                    when=When(False, "E2E: optional feature disabled", keep_if_exists=False, optional=True))
                set_xr_status("test.scenario", "optional-optout")

            elif mode == "explicit":
                # Explicit: user directly sets composite ready=False.
                set_composite_ready(False,
                    reason="WaitingForExternalSignal",
                    message="E2E: explicit set_composite_ready with reason/message")
                set_xr_status("test.scenario", "explicit-false")

            elif mode == "ready-false":
                # Explicit per-resource override: the MR itself becomes
                # Ready=True, but ready=False must keep the XR not-Ready
                # (function-auto-ready only fills in unspecified readiness).
                Resource("never-ready", {
                    "apiVersion": "nop.crossplane.io/v1alpha1",
                    "kind": "NopResource",
                    "spec": {"forProvider": {"conditionAfter": [
                        {"conditionType": "Ready", "conditionStatus": "True", "time": "0s"},
                        {"conditionType": "Synced", "conditionStatus": "True", "time": "0s"},
                    ]}},
                }, ready=False)
                set_xr_status("test.scenario", "ready-false")

            elif mode == "ready-true":
                # Explicit per-resource override: the MR never reports
                # Ready=True itself, but ready=True marks it ready in the
                # pipeline so the XR still reaches Ready=True.
                Resource("forced-ready", {
                    "apiVersion": "nop.crossplane.io/v1alpha1",
                    "kind": "NopResource",
                    "spec": {"forProvider": {"conditionAfter": [
                        {"conditionType": "Ready", "conditionStatus": "False", "time": "0s"},
                        {"conditionType": "Synced", "conditionStatus": "True", "time": "0s"},
                    ]}},
                }, ready=True)
                set_xr_status("test.scenario", "ready-true")

            else:
                fatal("unknown mode %q, expected gate|optional|explicit|ready-false|ready-true" % mode)
    - step: auto-ready
      functionRef:
        name: function-auto-ready
